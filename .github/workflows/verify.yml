name: Verify skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate Agent Skill
        run: python .agents/skills/material-design-3/scripts/validate_skill.py
      - name: Validate eval JSON
        run: python -m json.tool .agents/skills/material-design-3/evals/cases.json > /dev/null
      - name: Compile Python
        run: python -m compileall -q .agents/skills/material-design-3/scripts tests
